name: Auto - Verify & plan production
on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  terraform_verify:
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    runs-on: ubuntu-latest
    name: Auto Verify & plan terraform code
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -diff -recursive

      - name: Initialize Terraform
        run: terraform init -backend-config="./production.config"

      - name: Run Terraform Plan
        run: |
          terraform plan -input=false -var-file="production.tfvars" -out plan.tfplan >/dev/null && terraform show plan.tfplan
