name: Auto - Verify & plan production
on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  terraform_verify:
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_ec_apikey: ${{ secrets.ELASTIC_CLOUD_API_KEY }} # nexus uses ELASTIC CLOUD
      TF_VAR_ec_apikey2: ${{ secrets.ELASTIC_CLOUD_API_KEY2 }} # Second, new elastic cloud instance of the new AWS org
      TF_VAR_ec_snapshots_access_key_id: ${{ secrets.EC_SNAPSHOTS_ACCESS_KEY_ID }}
      TF_VAR_ec_snapshots_s3_bucket_name: ${{ secrets.EC_SNAPSHOTS_S3_BUCKET_NAME }}
      TF_VAR_ec_snapshots_s3_secret_access_key: ${{ secrets.EC_SNAPSHOTS_S3_SECRET_ACCESS_KEY }}
      TF_VAR_nise_dockerhub_password: ${{ secrets.NISE_DOCKERHUB_PASS }}

    runs-on: ubuntu-latest
    name: Auto Verify & plan terraform code
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -diff -recursive

      - name: Initialize Terraform
        run: terraform init -backend-config="./production.config"

      - name: Run Terraform Plan
        run: |
          terraform plan -var-file="production.tfvars" -out plan.tfplan >/dev/null && terraform show plan.tfplan
