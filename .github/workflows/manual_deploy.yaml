name: Manual - Apply changes

env:
  AWS_ROLE_ARN_STAGING: arn:aws:iam::992382665735:role/GithubTerraformDeploy
  AWS_ROLE_ARN_PRODUCTION: arn:aws:iam::671250183987:role/GithubTerraformDeploy
  SANITY_PROJECT_ID: fgi7eh1v
  SANITY_CLI_VERSION: 5.27.0

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: Which environment to deploy to
        required: true
        default: staging
        options:
          - staging
          - production
      sync_sanity_dataset:
        type: boolean
        description: Copy Sanity dataset from staging to production (only applies when deploying to production)
        default: true

concurrency:
  group: terraform-${{ inputs.environment }}-deploy
  cancel-in-progress: false

jobs:
  terraform_deployment:
    environment: ${{ inputs.environment }} # secrets are set per environment https://github.com/openbraininstitute/aws-terraform-deployment/settings/environments
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_azure_blobstore_opendata_sas_token: ${{ secrets.AZURE_BLOBSTORE_OPENDATA_SAS_TOKEN }}
      TF_VAR_azure_blobstore_internal_public_data_sas_token: ${{ secrets.AZURE_BLOBSTORE_INTERNAL_PUBLIC_DATA_SAS_TOKEN }}
      TF_VAR_azure_datasync_agent_activation_key_uswest2: ${{ secrets.AZURE_DATASYNC_AGENT_ACTIVATION_KEY_USWEST2 }}
      TF_VAR_azure_datasync_agent_activation_key_useast1: ${{ secrets.AZURE_DATASYNC_AGENT_ACTIVATION_KEY_USEAST1 }}

    runs-on: ubuntu-latest
    name: Manual terraform apply
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.environment == 'production' && env.AWS_ROLE_ARN_PRODUCTION || env.AWS_ROLE_ARN_STAGING }}
          aws-region: us-east-1

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform format check
        run: terraform fmt -check -diff -recursive

      - name: Initialize Terraform
        run: terraform init -backend-config="./${{ inputs.environment }}.config"

      - name: Run Terraform Plan
        run: |
          terraform plan -input=false -var-file="${{ inputs.environment }}.tfvars" -out plan.tfplan >/dev/null && terraform show plan.tfplan

      - name: Run Terraform Apply
        run: |
          terraform apply -auto-approve -var-file="${{ inputs.environment }}.tfvars"

      - name: Sync Sanity dataset (staging → production)
        if: inputs.sync_sanity_dataset == true && inputs.environment == 'production'
        env:
          SANITY_TOKEN: ${{ secrets.SANITY_TOKEN }}
        run: |
          set -e
          echo "$SANITY_TOKEN" | npx -y sanity@${SANITY_CLI_VERSION} login --with-token
          npx -y sanity@${SANITY_CLI_VERSION} datasets export staging staging.tar.gz --overwrite -p $SANITY_PROJECT_ID
          npx -y sanity@${SANITY_CLI_VERSION} datasets delete production --force -p $SANITY_PROJECT_ID
          npx -y sanity@${SANITY_CLI_VERSION} datasets create production --visibility public -p $SANITY_PROJECT_ID
          npx -y sanity@${SANITY_CLI_VERSION} datasets import staging.tar.gz -d production -p $SANITY_PROJECT_ID -t $SANITY_TOKEN
