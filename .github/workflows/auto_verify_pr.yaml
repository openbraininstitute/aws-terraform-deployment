name: Auto - Verify & plan branch environment
on:
  workflow_dispatch:
  pull_request:
    branches:
      - staging

concurrency:
  group: terraform-${{ github.base_ref }}

permissions:
  pull-requests: write

jobs:
  terraform_verify:
    environment: ${{ github.base_ref }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_ec_apikey2: ${{ secrets.ELASTIC_CLOUD_API_KEY2 }} # Second, new elastic cloud instance of the new AWS org
      TF_VAR_nise_dockerhub_password: ${{ secrets.NISE_DOCKERHUB_PASS }}
      TF_VAR_azure_vpn_gateway_preshared_key: ${{ secrets.AZURE_VPN_GATEWAY_PRESHARED_KEY }}
      TF_VAR_azure_vpn_gateway_tunnel1_ip_address: ${{ vars.AZURE_VPN_GATEWAY_TUNNEL1_IP_ADDRESS }}

    runs-on: ubuntu-latest
    name: Auto Verify & plan terraform code for branch environment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -diff -recursive

      - name: Initialize Terraform
        run: terraform init -backend-config="./${{ github.base_ref }}.config"

      - name: Run Terraform Plan
        run: |
          terraform plan -input=false -var-file="${{ github.base_ref }}.tfvars" -out plan.tfplan >/dev/null
          terraform show plan.tfplan
          terraform show -no-color -json plan.tfplan > tfplan.json

      - name: Run Terraform Change Pull Request Commenter Action
        uses: liatrio/terraform-change-pr-commenter@v1.7.1
        with:
          json-file: 'tfplan.json'
          expand-comment: 'true'
          include-workflow-link: 'true'
