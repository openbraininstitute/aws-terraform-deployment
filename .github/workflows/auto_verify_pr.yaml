name: Auto - Verify & plan branch environment
on:
  workflow_dispatch:
  pull_request:
    branches:
      - staging

concurrency:
  group: terraform-${{ github.base_ref }}

permissions:
  pull-requests: write

jobs:
  terraform_verify:
    environment: ${{ github.base_ref }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_azure_blobstore_opendata_sas_token: ${{ secrets.AZURE_BLOBSTORE_OPENDATA_SAS_TOKEN }}
      TF_VAR_azure_blobstore_internal_public_data_sas_token: ${{ secrets.AZURE_BLOBSTORE_INTERNAL_PUBLIC_DATA_SAS_TOKEN }}

    runs-on: ubuntu-latest
    name: Auto Verify & plan terraform code for branch environment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -diff -recursive

      - name: Initialize Terraform
        run: terraform init -backend-config="./${{ github.base_ref }}.config"

      - name: Run Terraform Plan
        run: |
          terraform plan -input=false -var-file="${{ github.base_ref }}.tfvars" -out plan.tfplan >/dev/null
          terraform show plan.tfplan
          terraform show -no-color -json plan.tfplan > tfplan.json

      - name: Run Terraform Change Pull Request Commenter Action
        uses: liatrio/terraform-change-pr-commenter@v1.7.1
        with:
          json-file: 'tfplan.json'
          expand-comment: 'true'
          include-workflow-link: 'true'
