Content-Type: text/cloud-config; charset="us-ascii"

#cloud-config

users:
    - name: obiuser
      uid: 4000
      ssh_authorized_keys:
        - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBCRTRSpJMLRRk0GuIcQ/OU5fGwgX0YhIMsy/sSgdzQc
      shell: /bin/bash

packages:
  - lustre-client

runcmd:
  - echo "========== Setting up FSX mount =========="
  - mkdir -p /data
  - grep -q "${fsx_dns_name}" /etc/fstab || echo "${fsx_dns_name}@tcp:/${fsx_mount_name} /data lustre defaults,_netdev 0 0" >> /etc/fstab
  - mount /data

