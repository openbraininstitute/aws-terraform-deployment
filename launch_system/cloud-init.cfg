Content-Type: text/cloud-config; charset="us-ascii"

#cloud-config

users:
  - name: obiuser
    uid: 4000
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBCRTRSpJMLRRk0GuIcQ/OU5fGwgX0YhIMsy/sSgdzQc
    shell: /bin/bash
%{ for user in sudo_users ~}
  - name: ${user.username}
    ssh_authorized_keys:
      - ${user.public_key}
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
%{ endfor ~}

packages:
  - lustre-client

runcmd:
  - echo "========== Setting up FSX mount =========="
  - mkdir -p /data/scratch
  - grep -q "${fsx_dns_name}" /etc/fstab || echo "${fsx_dns_name}@tcp:/${fsx_mount_name} /data/scratch/ lustre defaults,_netdev 0 0" >> /etc/fstab
  - mount /data/scratch
  - mkdir -p /data/aws_s3_open
  - mkdir -p /data/aws_s3_internal/public
  - mount -t efs -o tls,accesspoint=${opendata_access_point_id} ${publicdata_efs_id}:/ /data/aws_s3_open
  - mount -t efs -o tls,accesspoint=${publicdata_access_point_id} ${publicdata_efs_id}:/ /data/aws_s3_internal/public
  - install -o obiuser -g root -m 644 /dev/null /var/log/slurm-prolog-epilog.log
  - yum install -y https://s3.amazonaws.com/mountpoint-s3-release/latest/x86_64/mount-s3.rpm

write_files:
  - path: /etc/fuse.conf
    permissions: '0644'
    content: |
      user_allow_other

  - path: /etc/sudoers.d/95-obiuser-mount-s3
    permissions: '0440'
    content: |
      obiuser ALL=(root) NOPASSWD: /usr/local/bin/do-mount-s3.sh *
      obiuser ALL=(root) NOPASSWD: /usr/local/bin/do-unmount-s3.sh *

  - path: /usr/local/bin/parse-s3-comment.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      # Parse Slurm job comment for S3 mount info.
      # Outputs to stdout: BUCKET|PREFIX|MOUNT_PATH (or nothing if not applicable)
      # Diagnostic messages go to stderr.
      set -euo pipefail
      JOB_ID="$1"
      SCONTROL=/opt/aws/pcs/scheduler/slurm-${slurm_version}/bin/scontrol
      COMMENT=$($SCONTROL show job "$JOB_ID" -o | grep -oP 'Comment=\K[^ ]+' || true)
      if [ -z "$COMMENT" ]; then
        echo "$(date -Iseconds) parse-s3-comment: no comment for job $JOB_ID, skipping." >&2
        exit 0
      fi
      if [[ "$COMMENT" != "s3|"* ]]; then
        echo "$(date -Iseconds) parse-s3-comment: comment not s3-mount for job $JOB_ID, skipping." >&2
        exit 0
      fi
      IFS='|' read -r _ BUCKET PREFIX MOUNT_PATH <<< "$COMMENT"
      MOUNT_PATH="$${MOUNT_PATH%/}"
      if [ -z "$BUCKET" ] || [ -z "$PREFIX" ] || [ -z "$MOUNT_PATH" ]; then
        echo "$(date -Iseconds) parse-s3-comment: missing fields in comment for job $JOB_ID, skipping." >&2
        exit 0
      fi
      if [[ "$MOUNT_PATH" != /data/aws_s3_internal/private/* ]]; then
        echo "$(date -Iseconds) parse-s3-comment: ERROR mount path not allowed: $MOUNT_PATH (job $JOB_ID)" >&2
        exit 1
      fi
      echo "$BUCKET|$PREFIX|$MOUNT_PATH"

  - path: /usr/local/bin/do-mount-s3.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      BUCKET="$1"; PREFIX="$2"; MOUNT_PATH="$3"; JOB_ID="$4"
      [[ "$MOUNT_PATH" == /data/aws_s3_internal/private/* ]] || { echo "ERROR: path not allowed: $MOUNT_PATH" >&2; exit 1; }
      PREFIX="$${PREFIX#/}"; PREFIX="$${PREFIX%/}/"
      CACHE_DIR="/tmp/mount-s3-cache-$JOB_ID"
      mkdir -p "$MOUNT_PATH" "$CACHE_DIR"
      mount-s3 "$BUCKET" "$MOUNT_PATH" \
        --prefix "$PREFIX" --read-only --region ${region} \
        --allow-other --uid 4000 --gid 4000 \
        --cache "$CACHE_DIR" --max-cache-size 2048

  - path: /usr/local/bin/do-unmount-s3.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      MOUNT_PATH="$1"; JOB_ID="$2"
      [[ "$MOUNT_PATH" == /data/aws_s3_internal/private/* ]] || { echo "ERROR: path not allowed: $MOUNT_PATH" >&2; exit 1; }
      mountpoint -q "$MOUNT_PATH" && { umount "$MOUNT_PATH" || umount -l "$MOUNT_PATH"; }
      rmdir --parents "$MOUNT_PATH" 2>/dev/null || true
      rm -rf "/tmp/mount-s3-cache-$JOB_ID" 2>/dev/null || true

  - path: /usr/local/bin/task-prolog.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      LOG=/var/log/slurm-prolog-epilog.log
      PARSED=$(/usr/local/bin/parse-s3-comment.sh "$SLURM_JOB_ID" 2>>"$LOG") || exit $?
      [ -z "$PARSED" ] && exit 0
      IFS='|' read -r BUCKET PREFIX MOUNT_PATH <<< "$PARSED"
      if ! sudo /usr/local/bin/do-mount-s3.sh "$BUCKET" "$PREFIX" "$MOUNT_PATH" "$SLURM_JOB_ID" 2>>"$LOG"; then
        echo "$(date -Iseconds) task-prolog: ERROR failed to mount s3://$BUCKET/$PREFIX -> $MOUNT_PATH (job $SLURM_JOB_ID)" >> "$LOG"
        exit 1
      fi
      echo "$(date -Iseconds) task-prolog: mounted s3://$BUCKET/$PREFIX -> $MOUNT_PATH (job $SLURM_JOB_ID)" >> "$LOG"

  - path: /usr/local/bin/task-epilog.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      LOG=/var/log/slurm-prolog-epilog.log
      PARSED=$(/usr/local/bin/parse-s3-comment.sh "$SLURM_JOB_ID" 2>>"$LOG") || exit $?
      [ -z "$PARSED" ] && exit 0
      IFS='|' read -r _ _ MOUNT_PATH <<< "$PARSED"
      if ! sudo /usr/local/bin/do-unmount-s3.sh "$MOUNT_PATH" "$SLURM_JOB_ID" 2>>"$LOG"; then
        echo "$(date -Iseconds) task-epilog: ERROR failed to unmount $MOUNT_PATH (job $SLURM_JOB_ID)" >> "$LOG"
        exit 1
      fi
      echo "$(date -Iseconds) task-epilog: unmounted $MOUNT_PATH (job $SLURM_JOB_ID)" >> "$LOG"

--==BOUNDARY==--
