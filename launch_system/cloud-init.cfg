MIME-Version: 1.0

--==BOUNDARY==
Content-Type: text/cloud-config; charset="us-ascii"

#cloud-config

users:
  - name: obiuser
    uid: 4000
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBCRTRSpJMLRRk0GuIcQ/OU5fGwgX0YhIMsy/sSgdzQc
    shell: /bin/bash
%{ for user in sudo_users ~}
  - name: ${user.username}
    ssh_authorized_keys:
      - ${user.public_key}
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
%{ endfor ~}

packages:
  - lustre-client # already installed in recent custom AMIs
  - amazon-efs-utils # already installed in recent custom AMIs

runcmd:
  - echo "========== Setting up mount points =========="
  - set -x
  - mkdir -p /data/scratch
  - grep -q "${fsx_dns_name}" /etc/fstab || echo "${fsx_dns_name}@tcp:/${fsx_mount_name} /data/scratch/ lustre defaults,_netdev 0 0" >> /etc/fstab
  - mount /data/scratch
  - mkdir -p /data/aws_s3_open
  - mkdir -p /data/aws_s3_internal/public
  - mount -t efs -o tls,accesspoint=${opendata_access_point_id} ${publicdata_efs_id}:/ /data/aws_s3_open
  - mount -t efs -o tls,accesspoint=${publicdata_access_point_id} ${publicdata_efs_id}:/ /data/aws_s3_internal/public
  - install -o obiuser -g root -m 644 /dev/null /var/log/slurm-prolog-epilog.log
  - yum install -y https://s3.amazonaws.com/mountpoint-s3-release/latest/x86_64/mount-s3.rpm
  - mkdir -p /run/mount-s3
  - systemctl daemon-reload

write_files:
  - path: /etc/fuse.conf
    permissions: '0644'
    content: |
      user_allow_other

  - path: /etc/systemd/system/mount-s3-job@.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Mountpoint S3 for job %i

      [Service]
      # mount-s3 daemonizes by default (forks, parent exits).
      # Type=forking lets systemd track the child FUSE process,
      # which lives outside Slurm's job cgroup and survives the prolog.
      Type=forking
      EnvironmentFile=/run/mount-s3/%i.env
      ExecStart=/usr/local/bin/do-mount-s3.sh
      ExecStop=/usr/local/bin/do-unmount-s3.sh

  - path: /usr/local/bin/do-mount-s3.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      CACHE_DIR="/tmp/mount-s3-cache-$SLURM_JOB_ID"
      mkdir -p "$MOUNT_PATH" "$CACHE_DIR"
      mount-s3 "$MOUNT_BUCKET" "$MOUNT_PATH" \
        --prefix "$MOUNT_PREFIX" --read-only --region ${region} \
        --allow-other --uid 4000 --gid 4000 \
        --cache "$CACHE_DIR" --max-cache-size 2048

  - path: /usr/local/bin/do-unmount-s3.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      CACHE_DIR="/tmp/mount-s3-cache-$SLURM_JOB_ID"
      mountpoint -q "$MOUNT_PATH" && { umount "$MOUNT_PATH" || umount -l "$MOUNT_PATH"; }
      rmdir --parents "$MOUNT_PATH" 2>/dev/null || true
      rm -rf "$CACHE_DIR" 2>/dev/null || true

  - path: /usr/local/bin/slurm-prolog.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      # Slurm Prolog: mount private data for the job based off Slurm comment
      # Comment format: s3|bucket_name|prefix|mount_path
      LOG="/var/log/slurm-prolog-epilog.log"
      if [ -z "$${SLURM_JOB_COMMENT:-}" ]; then
        echo "$(date -Iseconds) prolog: no comment for job $SLURM_JOB_ID, skipping" >> "$LOG"
        exit 0
      fi
      if [[ "$SLURM_JOB_COMMENT" != "s3|"* ]]; then
        echo "$(date -Iseconds) prolog: comment not s3-mount for job $SLURM_JOB_ID, skipping" >> "$LOG"
        exit 0
      fi
      IFS='|' read -r _ BUCKET PREFIX MOUNT_PATH <<< "$SLURM_JOB_COMMENT"
      MOUNT_PATH="$${MOUNT_PATH%/}"
      if [ -z "$BUCKET" ] || [ -z "$PREFIX" ] || [ -z "$MOUNT_PATH" ]; then
        echo "$(date -Iseconds) prolog: missing fields in comment for job $SLURM_JOB_ID" >> "$LOG"
        exit 0
      fi
      if [[ "$MOUNT_PATH" != /data/aws_s3_internal/private/* ]]; then
        echo "$(date -Iseconds) prolog: ERROR mount path not allowed: $MOUNT_PATH (job $SLURM_JOB_ID)" >> "$LOG"
        exit 1
      fi
      PREFIX="$${PREFIX#/}"   # strip leading slash
      PREFIX="$${PREFIX%/}/"  # ensure exactly one trailing slash
      {
        echo "SLURM_JOB_ID=$SLURM_JOB_ID"
        echo "MOUNT_BUCKET=$BUCKET"
        echo "MOUNT_PREFIX=$PREFIX"
        echo "MOUNT_PATH=$MOUNT_PATH"
      } > "/run/mount-s3/$SLURM_JOB_ID.env"
      if ! systemctl start "mount-s3-job@$SLURM_JOB_ID" 2>>"$LOG"; then
        echo "$(date -Iseconds) prolog: ERROR failed to start mount-s3-job@$SLURM_JOB_ID" >> "$LOG"
        rm -f "/run/mount-s3/$SLURM_JOB_ID.env"
        exit 1
      fi
      echo "$(date -Iseconds) prolog: mounted s3://$BUCKET/$PREFIX -> $MOUNT_PATH (job $SLURM_JOB_ID)" >> "$LOG"

  - path: /usr/local/bin/slurm-epilog.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      # Slurm Epilog: unmount private data
      LOG="/var/log/slurm-prolog-epilog.log"
      ENV_FILE="/run/mount-s3/$SLURM_JOB_ID.env"
      [ -f "$ENV_FILE" ] || exit 0
      if ! systemctl stop "mount-s3-job@$SLURM_JOB_ID" 2>>"$LOG"; then
        echo "$(date -Iseconds) epilog: ERROR failed to stop mount-s3-job@$SLURM_JOB_ID" >> "$LOG"
      fi
      rm -f "$ENV_FILE"
      echo "$(date -Iseconds) epilog: unmounted (job $SLURM_JOB_ID)" >> "$LOG"

--==BOUNDARY==--
