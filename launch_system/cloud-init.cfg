Content-Type: text/cloud-config; charset="us-ascii"

#cloud-config

users:
  - name: obiuser
    uid: 4000
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBCRTRSpJMLRRk0GuIcQ/OU5fGwgX0YhIMsy/sSgdzQc
    shell: /bin/bash
%{ for user in sudo_users ~}
  - name: ${user.username}
    ssh_authorized_keys:
      - ${user.public_key}
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
%{ endfor ~}

packages:
  - lustre-client

runcmd:
  - echo "========== Setting up FSX mount =========="
  - mkdir -p /data/scratch
  - grep -q "${fsx_dns_name}" /etc/fstab || echo "${fsx_dns_name}@tcp:/${fsx_mount_name} /data/scratch/ lustre defaults,_netdev 0 0" >> /etc/fstab
  - mount /data/scratch
  - mkdir -p /data/aws_s3_open
  - mkdir -p /data/aws_s3_internal
  - mount -t efs -o tls,accesspoint=${opendata_access_point_id} ${publicdata_efs_id}:/ /data/aws_s3_open
  - mount -t efs -o tls,accesspoint=${publicdata_access_point_id} ${publicdata_efs_id}:/ /data/aws_s3_internal
  - mkdir -p /data/aws_s3_internal/private

write_files:
  - path: /etc/fuse.conf
    permissions: '0644'
    content: |
      user_allow_other

  - path: /usr/local/bin/prolog-mount-private-data.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      # Slurm Prolog: mount private data for the job.
      # Comment format: s3|bucket_name|prefix|mount_path
      COMMENT=$(scontrol show job "$SLURM_JOB_ID" | grep -oP 'Comment=\K[^\s]+' || true)
      if [ -z "$COMMENT" ] || [[ "$COMMENT" != s3|* ]]; then
        exit 0
      fi
      IFS='|' read -r _ BUCKET PREFIX MOUNT_PATH <<< "$COMMENT"
      if [ -z "$BUCKET" ] || [ -z "$PREFIX" ] || [ -z "$MOUNT_PATH" ]; then
        exit 0
      fi
      mkdir -p "$MOUNT_PATH"
      mount-s3 "$BUCKET" "$MOUNT_PATH" \
        --prefix "$PREFIX/" \
        --read-only \
        --region ${region} \
        --allow-other --uid 4000 --gid 4000 \
        --cache /tmp/mount-s3-cache
      if ! mountpoint -q "$MOUNT_PATH"; then
        echo "ERROR: mount-s3 failed for s3://$BUCKET/$PREFIX -> $MOUNT_PATH" >&2
        exit 1
      fi

  - path: /usr/local/bin/epilog-unmount-private-data.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      # Slurm Epilog: unmount private data after job completes.
      COMMENT=$(scontrol show job "$SLURM_JOB_ID" | grep -oP 'Comment=\K[^\s]+' || true)
      if [ -z "$COMMENT" ] || [[ "$COMMENT" != s3|* ]]; then
        exit 0
      fi
      IFS='|' read -r _ _ _ MOUNT_PATH <<< "$COMMENT"
      if [ -n "$MOUNT_PATH" ] && mountpoint -q "$MOUNT_PATH"; then
        umount "$MOUNT_PATH" || umount -l "$MOUNT_PATH"
        rmdir "$MOUNT_PATH" 2>/dev/null || true
      fi
      rm -rf /tmp/mount-s3-cache 2>/dev/null || true

--==BOUNDARY==--
